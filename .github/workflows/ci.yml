name: Backend checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nutrition
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nutrition_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://nutrition:ci-only-password@localhost:5432/nutrition_test
      SECRET_KEY: isolated-ci-key-at-least-32-characters
      BACKUP_ENCRYPTION_KEY: isolated-ci-backup-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest==9.1.1
      - name: Verify PostgreSQL migrations are repeatable
        run: |
          python prepare_db.py
          python prepare_db.py
      - run: python -m pytest tests -q
